{% extends 'base.html' %}{% block title %}Изменить товар — IRSbese{% endblock %}{% block content %}<div class="page-head compact"><span class="eyebrow">IRSBESE / ПРОДАВЕЦ</span><h1>Изменить товар.</h1></div><form method="post" class="form-card narrow"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Название<input name="name" value="{{ product['name'] }}" required maxlength="120"></label><label>Категория<input name="category" value="{{ product['category'] }}" required maxlength="60"></label><label>Цена<input name="price" type="number" min="0.01" step="0.01" value="{{ product['price'] }}" required></label><label>Количество<input name="stock" type="number" min="0" max="10000" value="{{ product['stock'] }}" required></label><label>Описание<textarea name="description" required maxlength="1500">{{ product['description'] }}</textarea></label><button class="button primary">Сохранить</button></form>{% endblock %}
