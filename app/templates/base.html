<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0E0F12"><meta name="description" content="IRSbese — маркетплейс для покупки товаров и размещения предложений продавцов."><title>{% block title %}IRSbese — маркетплейс{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/tokens.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/base.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/components.css') }}"></head><body>{% include 'partials/header.html' %}<main class="container page-content{% block main_class %}{% endblock %}">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-list">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}<button type="button" aria-label="Закрыть" data-dismiss-flash>×</button></div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>{% include 'partials/footer.html' %}<script src="{{ url_for('static',filename='js/main.js') }}"></script></body></html>
