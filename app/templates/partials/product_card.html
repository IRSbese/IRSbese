<article class="product-card"><a class="product-visual visual-{{ (product['id'] % 6) }}" href="{{ url_for('product.product_page',product_id=product['id']) }}">{% if product['image'] %}<img src="{{ url_for('static',filename=product['image']) }}" alt="{{ product['name'] }}">{% else %}<span class="visual-symbol">{% set symbols=['✳','◈','▱','⌘','◯','◇'] %}{{ symbols[(product['id']-1)%6] }}</span>{% endif %}<span class="visual-tag">IRS PICK</span></a><div class="product-info"><div class="product-category">{{ product['category'] }}</div><a href="{{ url_for('product.product_page',product_id=product['id']) }}" class="product-name">{{ product['name'] }}</a><div class="product-bottom"><strong>{{ '%.0f'|format(product['price']) }} ₽</strong><form method="post" action="{{ url_for('cart.add_to_cart',product_id=product['id']) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="add-button" aria-label="Добавить в корзину">+</button></form></div></div></article>
