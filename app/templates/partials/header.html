<header class="site-header"><div class="container nav-wrap"><a class="brand" href="{{ url_for('main.home') }}"><img src="{{ url_for('static',filename='img/01_logo_main_transparent.png') }}" alt="IRSbese"></a><nav class="main-nav"><a href="{{ url_for('catalog.catalog') }}">Каталог</a><a href="{{ url_for('seller.seller') }}">Продавцам</a></nav><div class="nav-actions"><a class="icon-link" href="{{ url_for('cart.cart') }}">Корзина <span class="count">{{ cart_count }}</span></a>{% if current_user %}<a class="account-link" href="{{ url_for('account.account') }}">{{ current_user['name'] }}</a><form method="post" action="{{ url_for('account.logout') }}" class="inline-form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="link-button">Выйти</button></form>{% else %}<a class="account-link" href="{{ url_for('account.login') }}">Войти</a>{% endif %}<button class="menu-toggle" aria-label="Открыть меню" aria-expanded="false">☰</button></div></div></header>
