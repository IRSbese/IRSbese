{% extends "base.html" %}
{% block title %}Вход — IRSbese{% endblock %}
{% block content %}
<section class="section narrow">
    <h1>Вход</h1>
    <form class="panel form-panel" method="POST">
        <label>Email или Логин
            <input type="text" name="login" placeholder="name@example.com" required>
        </label>
        <label>Пароль
            <input type="password" name="password" placeholder="Пароль" required>
        </label>
        <button class="button" type="submit">Войти</button>
        <p class="muted small">Авторизация защищена Argon2.</p>
    </form>
</section>
{% endblock %}
